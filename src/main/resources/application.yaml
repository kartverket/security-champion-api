spring:
  application:
    name: security-champion-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      schema: secchamp
      maximum-pool-size: 5
      minimum-idle: 1


management:
  server:
    port: 8081
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: prometheus,health
    access:
      default: read_only
  endpoint:
    prometheus:
      access: read_only
    health:
      access: read_only

server:
  port: ${PORT:8080}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:security-champion-api}
  resource:
    attributes: service.namespace=${OTEL_SERVICE_NAMESPACE:sikkerhetsmetrikker},deployment.environment=${DEPLOYMENT_ENVIRONMENT:dev}
  traces:
    exporter: otlp
    sampler: parentbased_always_on
  metrics:
    exporter: none
  logs:
    exporter: none
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otlp.grafana-alloy:4317}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:grpc}
  propagators: tracecontext,baggage
  instrumentation:
    micrometer:
      enabled: false

