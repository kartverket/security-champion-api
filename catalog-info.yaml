apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: security-champion-service
  tags:
    - internal
spec:
  type: service
  lifecycle: production
  owner: skvis
  providesApis:
    - api:default/security-champion-api-api
    - api:default/security-champion-api-new
  system: utviklerportal
  consumesApis:
    - api:default/security-champion-api-new
    - api:default/meldingstjeneste-api
  dependsOn:
    - resource:default/new-resource
    - component:default/prodspek_fkb_bane

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: security-champion-api-new
  tags:
    - internal
spec:
  type: openapi
  lifecycle: production
  owner: skvis
  definition:
    $text: /api-schema.json

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: new-resource
spec:
  type: s3-bucket
  owner: group:default/designsystem_-_product_owner
  system: system:default/nytt-system
  dependencyOf:
    - component:default/security-champion-service
    - resource:default/new-resource

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: nytt-system
spec:
  type: product
  owner: group:default/regelrett_1
  domain: domain:default/new-domain

---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: new-domain
spec:
  owner: group:default/regelrett_1
  subdomainOf:
    - domain:default/innsikt
    - domain:default/plattform
